<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Banking Chatbot</title>
<style>
  :root { --bg:#f4f6fb; --card:#ffffff; --accent:#0e1b33; --accent2:#d62828; --text:#1c2430; --muted:#6b7686; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--accent); color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header a { color:#fff; text-decoration:none; font-size:13px; background:rgba(255,255,255,.12); padding:7px 12px; border-radius:8px; }
  #setup { max-width:760px; margin:40px auto; background:var(--card); padding:32px; border-radius:14px; box-shadow:0 2px 10px rgba(20,30,60,.08); width:90%; }
  #setup h2 { margin-top:0; font-size:19px; }
  #setup p { color:var(--muted); font-size:14px; }
  #setup .row { display:flex; gap:10px; margin-top:18px; }
  #setup input { flex:1; padding:11px 14px; border:1px solid #ccd3e0; border-radius:9px; font-size:14px; }
  button { cursor:pointer; border:none; border-radius:9px; font-size:14px; padding:11px 18px; background:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #chat { display:none; flex-direction:column; flex:1; max-width:820px; width:96%; margin:0 auto; }
  #messages { flex:1; overflow-y:auto; padding:20px 6px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:78%; padding:11px 15px; border-radius:13px; font-size:14.5px; line-height:1.45; white-space:pre-wrap; box-shadow:0 1px 4px rgba(20,30,60,.06); }
  .assistant { background:var(--card); align-self:flex-start; border-bottom-left-radius:4px; }
  .user { background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .done { background:#e8f7ee; border:1px solid #b7e4c7; align-self:center; text-align:center; color:#1b6b3a; font-weight:600; }
  .suggestions { display:flex; flex-wrap:wrap; gap:8px; padding:4px 6px 10px; }
  .suggestions button { background:#eef1f8; color:var(--accent); border:1px solid #ccd6ea; padding:8px 13px; border-radius:999px; font-weight:500; font-size:13px; }
  #composer { display:flex; gap:10px; padding:12px 6px 18px; }
  #composer input { flex:1; padding:13px 16px; border:1px solid #ccd3e0; border-radius:11px; font-size:14.5px; }
  #statusbar { font-size:12px; color:var(--muted); text-align:center; padding-bottom:8px; }
  #statusbar a { color:var(--accent); }
  .err { color:var(--accent2); font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<header>
  <h1>🏦 Retail Banking Chatbot — standalone UI</h1>
  <a href="/logs" target="_blank">📊 Open log viewer</a>
</header>

<div id="setup">
  <h2>Start a conversation</h2>
  <p>This UI drives the <b>same</b> deployed Mistral workflow you use in Vibe Work and Studio. Enter a customer id to begin (the prototype only has the <code>demo</code> profile, Sophie Martin).</p>
  <div class="row">
    <input id="userId" value="demo" placeholder="user_id (e.g. demo)">
    <button id="startBtn" onclick="startSession()">Start chat</button>
  </div>
  <div class="err" id="setupErr"></div>
</div>

<div id="chat">
  <div id="messages"></div>
  <div class="suggestions" id="suggestions"></div>
  <div id="composer">
    <input id="inputBox" placeholder="Type your message…" onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
  <div id="statusbar"></div>
</div>

<script>
let executionId = null;
let finished = false;
let pollTimer = null;

const $ = (id) => document.getElementById(id);

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function setSuggestions(items) {
  const box = $('suggestions');
  box.innerHTML = '';
  (items || []).forEach(s => {
    const b = document.createElement('button');
    b.textContent = s;
    b.onclick = () => { $('inputBox').value = s; sendMessage(); };
    box.appendChild(b);
  });
}

async function startSession() {
  $('setupErr').style.display = 'none';
  $('startBtn').disabled = true;
  try {
    const res = await fetch('/api/session', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: $('userId').value || 'demo'})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Failed to start');
    executionId = data.execution_id;
    $('setup').style.display = 'none';
    $('chat').style.display = 'flex';
    poll();
    pollTimer = setInterval(poll, 1500);
  } catch (e) {
    $('setupErr').textContent = 'Error: ' + e.message + ' — is MISTRAL_API_KEY set and the workflow deployed?';
    $('setupErr').style.display = 'block';
    $('startBtn').disabled = false;
  }
}

async function sendMessage() {
  const box = $('inputBox');
  const text = box.value.trim();
  if (!text || !executionId || finished) return;
  box.value = '';
  addMsg('user', text);
  setSuggestions([]);
  $('sendBtn').disabled = true;
  try {
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({execution_id: executionId, text})
    });
    if (!res.ok) {
      const d = await res.json();
      addMsg('assistant', '⚠️ ' + (d.detail || 'Could not deliver the message.'));
    }
  } catch (e) {
    addMsg('assistant', '⚠️ Network error: ' + e.message);
  }
  $('sendBtn').disabled = false;
  box.focus();
}

async function poll() {
  if (!executionId) return;
  try {
    const res = await fetch('/api/updates?execution_id=' + encodeURIComponent(executionId));
    const d = await res.json();
    if (d.busy) return;
    (d.messages || []).forEach(m => addMsg('assistant', m.text));
    setSuggestions(d.pending ? d.pending.suggestions : []);
    $('statusbar').innerHTML = 'Execution <code>' + executionId.slice(0, 12) + '…</code> — status: <b>' + (d.status || '?') + '</b> · <a href="/logs?execution_id=' + encodeURIComponent(executionId) + '" target="_blank">view logs & trace</a>';
    if (d.result) addMsg('done', d.result);
    if (d.status && ['COMPLETED','FAILED','CANCELED','TERMINATED','TIMED_OUT'].includes(d.status)) {
      finished = true;
      clearInterval(pollTimer);
      $('sendBtn').disabled = true;
      $('inputBox').disabled = true;
      if (d.status !== 'COMPLETED') addMsg('assistant', '⚠️ The workflow ended with status ' + d.status + '.');
      // one last poll to flush remaining logs/traces
      fetch('/api/updates?execution_id=' + encodeURIComponent(executionId));
    }
  } catch (e) { /* transient network error: retry on next tick */ }
}
</script>
</body>
</html>
