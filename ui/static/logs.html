<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Logs & Trace</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --accent:#0e1b33; --muted:#6b7686; --line:#e3e8f2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:#1c2430; height:100vh; display:flex; flex-direction:column; }
  header { background:var(--accent); color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; }
  header a { color:#fff; text-decoration:none; font-size:13px; background:rgba(255,255,255,.12); padding:7px 12px; border-radius:8px; }
  #layout { display:flex; flex:1; min-height:0; }
  #sidebar { width:320px; background:var(--card); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
  #sidebar h2 { font-size:13px; text-transform:uppercase; color:var(--muted); margin:6px 4px; }
  .session { padding:10px 12px; border-radius:9px; cursor:pointer; margin-bottom:6px; border:1px solid transparent; }
  .session:hover { background:#f0f3fa; }
  .session.active { border-color:#9db4e8; background:#eef2fc; }
  .session .id { font-family:monospace; font-size:12.5px; font-weight:600; }
  .session .meta { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:999px; font-size:10.5px; font-weight:700; }
  .RUNNING { background:#fff3cd; color:#8a6d00; }
  .COMPLETED { background:#d9f2e3; color:#1b6b3a; }
  .FAILED, .TERMINATED, .TIMED_OUT, .CANCELED { background:#fde2e2; color:#a4262c; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #tabs { display:flex; gap:4px; padding:10px 16px 0; background:var(--card); border-bottom:1px solid var(--line); }
  #tabs button { background:transparent; color:var(--muted); padding:9px 16px; border-radius:9px 9px 0 0; font-weight:600; font-size:13.5px; border-bottom:2px solid transparent; }
  #tabs button.active { color:var(--accent); border-bottom-color:var(--accent); }
  #content { flex:1; overflow-y:auto; padding:16px 20px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; font-size:12.8px; }
  th { text-align:left; background:#eef1f8; padding:8px 10px; font-size:11.5px; text-transform:uppercase; color:var(--muted); position:sticky; top:0; }
  td { padding:7px 10px; border-top:1px solid var(--line); vertical-align:top; }
  td.mono { font-family:monospace; white-space:nowrap; font-size:12px; }
  .sev-ERROR, .sev-err { color:#a4262c; font-weight:700; }
  .sev-WARN { color:#8a6d00; font-weight:700; }
  .empty { color:var(--muted); font-size:13.5px; padding:30px; text-align:center; }
  .bar { height:8px; border-radius:4px; background:var(--accent); opacity:.75; display:inline-block; vertical-align:middle; }
  .eventtype { font-family:monospace; font-size:11.5px; background:#eef1f8; padding:1px 6px; border-radius:5px; white-space:nowrap; }
  .tasktype { font-family:monospace; font-size:11.5px; color:var(--muted); }
  #refresh { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; padding:8px 20px 0; }
</style>
</head>
<body>
<header>
  <h1>📊 Workflow logs &amp; OTel trace viewer</h1>
  <a href="/" target="_blank">💬 Chat UI</a>
</header>
<div id="layout">
  <div id="sidebar">
    <h2>Executions</h2>
    <div id="sessions" class="empty">Loading…</div>
  </div>
  <div id="main">
    <div id="tabs">
      <button class="active" data-tab="events" onclick="setTab('events')">Events</button>
      <button data-tab="logs" onclick="setTab('logs')">Logs</button>
      <button data-tab="trace" onclick="setTab('trace')">OTel trace (spans)</button>
    </div>
    <div id="refresh"><input type="checkbox" id="autoRefresh" checked onchange="schedule()"> auto-refresh every 3s · data captured locally in SQLite</div>
    <div id="content"></div>
  </div>
</div>
<script>
let executionId = new URLSearchParams(location.search).get('execution_id');
let tab = 'events';
const $ = (id) => document.getElementById(id);

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function shortTime(nsOrTs) {
  if (!nsOrTs) return '';
  if (String(nsOrTs).length > 14) { // epoch ns
    return new Date(Number(nsOrTs) / 1e6).toISOString().replace('T', ' ').slice(0, 23);
  }
  return String(nsOrTs).replace('T', ' ').slice(0, 23);
}

async function loadSessions() {
  const res = await fetch('/api/executions');
  const d = await res.json();
  const box = $('sessions');
  if (!d.executions.length) { box.className = 'empty'; box.textContent = 'No sessions yet — start a chat first.'; return; }
  box.className = '';
  box.innerHTML = d.executions.map(e => `
    <div class="session ${e.execution_id === executionId ? 'active' : ''}" onclick="selectExec('${e.execution_id}')">
      <div class="id">${esc(e.execution_id.slice(0, 18))}…</div>
      <div class="meta">user <b>${esc(e.user_id)}</b> · ${esc((e.started_at || '').replace('T', ' ').slice(5, 19))}<br>
        <span class="badge ${esc(e.status || '')}">${esc(e.status || '?')}</span>
        ${e.events} events · ${e.logs} logs · ${e.spans} spans</div>
    </div>`).join('');
}

function selectExec(id) {
  executionId = id;
  history.replaceState(null, '', '/logs?execution_id=' + encodeURIComponent(id));
  loadSessions(); loadTab();
}

function setTab(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  loadTab();
}

async function loadTab() {
  const c = $('content');
  if (!executionId) { c.innerHTML = '<div class="empty">Select an execution on the left.</div>'; return; }
  if (tab === 'events') {
    const d = await (await fetch('/api/events?execution_id=' + encodeURIComponent(executionId))).json();
    if (!d.events.length) { c.innerHTML = '<div class="empty">No events captured yet.</div>'; return; }
    c.innerHTML = '<table><tr><th>Time</th><th>Event</th><th>Task type</th><th>Text</th></tr>' +
      d.events.map(e => `<tr><td class="mono">${esc(shortTime(e.ts_ns))}</td>
        <td><span class="eventtype">${esc(e.event_type)}</span></td>
        <td class="tasktype">${esc(e.task_type || '')}</td>
        <td>${esc(e.text || '')}</td></tr>`).join('') + '</table>';
  } else if (tab === 'logs') {
    const d = await (await fetch('/api/logs?execution_id=' + encodeURIComponent(executionId))).json();
    if (!d.logs.length) { c.innerHTML = '<div class="empty">No worker logs captured for this execution (the workflow does not emit any).<br>Logs appear here when the workflow code writes logs.</div>'; return; }
    c.innerHTML = '<table><tr><th>Time</th><th>Severity</th><th>Body</th></tr>' +
      d.logs.map(l => `<tr><td class="mono">${esc(shortTime(l.ts))}</td>
        <td class="sev-${esc(l.severity)}">${esc(l.severity)}</td>
        <td>${esc(l.body)}</td></tr>`).join('') + '</table>';
  } else {
    const d = await (await fetch('/api/trace?execution_id=' + encodeURIComponent(executionId))).json();
    if (!d.spans.length) { c.innerHTML = '<div class="empty">No OTel spans captured yet — they sync a few seconds after activity.</div>'; return; }
    const maxDur = Math.max(...d.spans.map(s => s.duration_ms || 0), 1);
    c.innerHTML = '<table><tr><th>Span</th><th>Start</th><th>Duration</th><th>Timeline</th></tr>' +
      d.spans.map(s => `<tr><td>${esc(s.name || s.span_id || '')}</td>
        <td class="mono">${esc(shortTime(s.start_time_unix_nano))}</td>
        <td class="mono">${s.duration_ms != null ? s.duration_ms.toFixed(1) + ' ms' : ''}</td>
        <td><span class="bar" style="width:${Math.max(2, (s.duration_ms || 0) / maxDur * 220)}px"></span></td></tr>`).join('') + '</table>';
  }
}

function schedule() {
  if ($('autoRefresh').checked) {
    loadSessions();
    loadTab();
    setTimeout(schedule, 3000);
  }
}
loadSessions(); loadTab(); schedule();
</script>
</body>
</html>
